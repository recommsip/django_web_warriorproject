{% extends 'game/base.html' %} {# Remove or change if you don't use a base layout #}

{% block content %}
<h2>Game Login</h2>

<!-- Display login error messages (e.g., incorrect password) -->
{% if form.errors %}
  <p style="color: red;">Invalid username or password. Please try again.</p>
{% endif %}

<form method="post" action="{% url 'game:login' %}">
  {% csrf_token %}
  
  <div>
    <label for="id_username">Username:</label>
    {{ form.username }}
  </div>
  
  <br>

  <div>
    <label for="id_password">Password:</label>
    {{ form.password }}
  </div>

  <br>

  <button type="submit">Log In</button>
  
  <!-- Preserves the page the user was trying to reach before login -->
  <input type="hidden" name="next" value="{{ next }}">
</form>
{% endblock %}
