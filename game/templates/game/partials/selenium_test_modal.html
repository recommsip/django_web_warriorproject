{% load static %}

<div
    class="modal fade"
    id="seleniumModal"
    tabindex="-1"
    aria-labelledby="seleniumModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <!-- HEADER -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="seleniumModalLabel"
                >
                    Selenium Test
                </h5>

                <span
                    id="seleniumStatus"
                    class="badge bg-secondary ms-3"
                >
                    Starting
                </span>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>


            <!-- BODY -->

            <div class="modal-body">

                <div class="mb-2">
                    <strong>Test Output</strong>
                </div>

                <pre
                    id="seleniumOutput"
                    style="
                        background: #111;
                        color: #08ff84;
                        padding: 15px;
                        height: 350px;
                        overflow-y: auto;
                        border-radius: 5px;
                    "
                >Waiting for test...</pre>

            </div>


            <!-- FOOTER -->

            <div class="modal-footer">

                <button
                    id="seleniumCloseButton"
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                    disabled
                >
                    Close
                </button>

            </div>

        </div>

    </div>

</div>
