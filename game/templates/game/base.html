{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>The Warrior's Journey</title>
  
  <!-- 1. External Frameworks (Bootstrap) First -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 2. Your Custom CSS Second (Overrides Bootstrap) -->
  <!-- <link href="{% static 'css/style.css' %}" rel="stylesheet"> -->

  {% block extra_css %}
  <!-- extra css here -->
   <style>
   body { 
    display: flex;
    justify-content: center; /* Centers child horizontally */
    font-family: sans-serif; 
    margin: 100px; /* Fixed: added 'px' */
    min-height: 100vh; /* Ensures body takes up full screen height */
  }
  </style>

  {% endblock %}
</head>
<body>
  <div class="content">
  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <!-- Wrap the content block in a container class -->
  <main class="page-container">
    {% block content %}{% endblock %}
    
  </main>
</div>
</body>
</html>
