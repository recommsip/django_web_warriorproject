<svg width="500" height="600" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgSG" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3a4a2e"/>
      <stop offset="100%" stop-color="#161f10"/>
    </radialGradient>
  </defs>
  <rect width="500" height="600" fill="url(#bgSG)"/>
  <circle cx="250" cy="240" r="190" fill="none" stroke="#7a9a4a" stroke-width="6" opacity="0.5"/>

  <!-- bubbles -->
  <g fill="#8ab060" opacity="0.5">
    <circle cx="400" cy="480" r="8"/>
    <circle cx="415" cy="440" r="5"/>
    <circle cx="90" cy="500" r="6"/>
  </g>

  <!-- tattered mossy cloak -->
  <path d="M150 360 Q128 480 165 570 L335 570 Q372 480 350 360 Z" fill="#3a4a24" stroke="#161f10" stroke-width="6"/>

  <!-- body, mottled -->
  <path d="M185 350 Q250 328 315 350 L320 470 Q250 495 180 470 Z" fill="#5a7a3c" stroke="#161f10" stroke-width="6"/>
  <g fill="#4a6430" opacity="0.6">
    <circle cx="215" cy="400" r="10"/>
    <circle cx="270" cy="430" r="12"/>
    <circle cx="240" cy="460" r="8"/>
  </g>

  <!-- arms -->
  <rect x="148" y="355" width="30" height="95" rx="14" fill="#5a7a3c" stroke="#161f10" stroke-width="6" transform="rotate(14 163 402)"/>
  <rect x="322" y="355" width="30" height="95" rx="14" fill="#5a7a3c" stroke="#161f10" stroke-width="6" transform="rotate(-16 337 402)"/>
  <circle cx="170" cy="454" r="18" fill="#6a8a48" stroke="#161f10" stroke-width="5"/>
  <circle cx="328" cy="440" r="18" fill="#6a8a48" stroke="#161f10" stroke-width="5"/>

  <!-- spear -->
  <g transform="rotate(15 328 440)">
    <rect x="322" y="220" width="10" height="225" rx="3" fill="#5a4a2c" stroke="#161f10" stroke-width="3"/>
    <path d="M317 200 L327 165 L337 200 Z" fill="#a8b8b0" stroke="#161f10" stroke-width="3"/>
  </g>

  <!-- neck -->
  <rect x="228" y="320" width="44" height="34" fill="#6a8a48" stroke="#161f10" stroke-width="5"/>

  <!-- head, greenish -->
  <ellipse cx="250" cy="240" rx="80" ry="76" fill="#7a9a52" stroke="#161f10" stroke-width="7"/>

  <!-- ears -->
  <path d="M172 228 Q118 205 125 148 Q178 168 200 218 Z" fill="#6a8a44" stroke="#161f10" stroke-width="6"/>
  <path d="M328 228 Q382 205 375 148 Q322 168 300 218 Z" fill="#6a8a44" stroke="#161f10" stroke-width="6"/>

  <!-- reed hat / mossy cap -->
  <path d="M182 200 Q200 140 250 132 Q300 140 318 200 Q305 165 250 160 Q195 165 182 200 Z" fill="#4a6428" stroke="#161f10" stroke-width="6"/>
  <path d="M240 132 L235 95 M250 130 L250 88 M262 132 L268 95" stroke="#8ab060" stroke-width="4" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="220" cy="242" rx="13" ry="15" fill="#e8f0a0"/>
  <ellipse cx="280" cy="242" rx="13" ry="15" fill="#e8f0a0"/>
  <ellipse cx="220" cy="244" rx="5" ry="6" fill="#1a1210"/>
  <ellipse cx="280" cy="244" rx="5" ry="6" fill="#1a1210"/>
  <path d="M200 222 Q220 210 240 224" fill="none" stroke="#161f10" stroke-width="5" stroke-linecap="round"/>
  <path d="M260 224 Q280 210 300 222" fill="none" stroke="#161f10" stroke-width="5" stroke-linecap="round"/>

  <!-- warts -->
  <circle cx="205" cy="270" r="5" fill="#4a6428" stroke="#161f10" stroke-width="2"/>
  <circle cx="295" cy="260" r="4" fill="#4a6428" stroke="#161f10" stroke-width="2"/>

  <!-- nose -->
  <path d="M250 252 Q238 272 250 280 Q262 272 250 252" fill="#6a8a44" stroke="#161f10" stroke-width="4"/>

  <!-- mouth with tusks -->
  <path d="M212 290 Q250 312 288 290 Q282 306 250 308 Q218 306 212 290 Z" fill="#2a3818" stroke="#161f10" stroke-width="4"/>
  <path d="M226 293 L221 307" stroke="#e8e0c0" stroke-width="5" stroke-linecap="round"/>
  <path d="M274 293 L279 307" stroke="#e8e0c0" stroke-width="5" stroke-linecap="round"/>

  <text x="250" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#c8e090">swamp goblin</text>
</svg>
