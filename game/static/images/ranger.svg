<svg width="500" height="600" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgR" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2f4a2a"/>
      <stop offset="100%" stop-color="#182414"/>
    </radialGradient>
  </defs>
  <rect width="500" height="600" fill="url(#bgR)"/>
  <circle cx="250" cy="230" r="190" fill="none" stroke="#7ab04a" stroke-width="6" opacity="0.5"/>

  <!-- cloak -->
  <path d="M140 325 Q120 470 155 580 L345 580 Q380 470 360 325 Z" fill="#3a5a28" stroke="#182414" stroke-width="6"/>

  <!-- tunic -->
  <path d="M175 320 Q250 295 325 320 L335 470 Q250 500 165 470 Z" fill="#5a7a3a" stroke="#182414" stroke-width="6"/>
  <path d="M205 340 L295 340 L288 460 Q250 475 212 460 Z" fill="#6a8f48" stroke="#182414" stroke-width="4"/>

  <!-- belt -->
  <rect x="185" y="410" width="130" height="18" fill="#4a3418" stroke="#182414" stroke-width="4"/>
  <rect x="238" y="406" width="24" height="26" fill="#8a6a3a" stroke="#182414" stroke-width="3"/>

  <!-- arms -->
  <rect x="140" y="330" width="32" height="105" rx="15" fill="#4a6a30" stroke="#182414" stroke-width="6" transform="rotate(12 156 382)"/>
  <rect x="328" y="330" width="32" height="105" rx="15" fill="#4a6a30" stroke="#182414" stroke-width="6" transform="rotate(-18 344 382)"/>
  <circle cx="168" cy="440" r="20" fill="#c98a52" stroke="#182414" stroke-width="5"/>
  <circle cx="332" cy="425" r="20" fill="#c98a52" stroke="#182414" stroke-width="5"/>

  <!-- bow -->
  <path d="M400 260 Q430 380 400 500" fill="none" stroke="#5a3a1c" stroke-width="10" stroke-linecap="round"/>
  <line x1="400" y1="260" x2="400" y2="500" stroke="#e8e0c8" stroke-width="2"/>

  <!-- quiver -->
  <rect x="150" y="330" width="30" height="90" rx="8" fill="#6a4a28" stroke="#182414" stroke-width="4" transform="rotate(-15 165 375)"/>

  <!-- neck -->
  <rect x="228" y="290" width="44" height="40" fill="#c98a52" stroke="#182414" stroke-width="5"/>

  <!-- head -->
  <circle cx="250" cy="220" r="78" fill="#d99a63" stroke="#182414" stroke-width="7"/>

  <!-- hood -->
  <path d="M165 210 Q155 110 250 100 Q345 110 335 210 Q335 150 250 145 Q165 150 165 210 Z" fill="#3a5a28" stroke="#182414" stroke-width="6"/>
  <path d="M250 100 Q290 60 260 30 Q245 55 250 100" fill="#3a5a28" stroke="#182414" stroke-width="5"/>

  <!-- feather -->
  <path d="M258 40 Q280 15 300 10 Q285 35 265 45" fill="#8a6a3a" stroke="#182414" stroke-width="3"/>

  <!-- eyes -->
  <ellipse cx="218" cy="215" rx="9" ry="11" fill="#1a1210"/>
  <ellipse cx="282" cy="215" rx="9" ry="11" fill="#1a1210"/>
  <path d="M200 198 Q218 188 236 200" fill="none" stroke="#182414" stroke-width="5" stroke-linecap="round"/>
  <path d="M264 200 Q282 188 300 198" fill="none" stroke="#182414" stroke-width="5" stroke-linecap="round"/>

  <!-- face marking -->
  <path d="M210 235 L225 240" stroke="#5a7a3a" stroke-width="4" stroke-linecap="round"/>
  <path d="M275 240 L290 235" stroke="#5a7a3a" stroke-width="4" stroke-linecap="round"/>

  <!-- nose + mouth -->
  <path d="M250 220 L245 245 Q250 250 255 245" fill="none" stroke="#182414" stroke-width="4" stroke-linecap="round"/>
  <path d="M228 258 Q250 265 272 258" fill="none" stroke="#182414" stroke-width="5" stroke-linecap="round"/>

  <text x="250" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#d8f0c0">ranger</text>
</svg>
