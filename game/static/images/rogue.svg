<svg width="500" height="600" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgRo" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3a2a45"/>
      <stop offset="100%" stop-color="#1a1220"/>
    </radialGradient>
  </defs>
  <rect width="500" height="600" fill="url(#bgRo)"/>
  <circle cx="250" cy="230" r="190" fill="none" stroke="#9a6ab0" stroke-width="6" opacity="0.5"/>

  <!-- cloak -->
  <path d="M145 325 Q125 470 160 580 L340 580 Q375 470 355 325 Z" fill="#241a2e" stroke="#0f0a14" stroke-width="6"/>

  <!-- tunic -->
  <path d="M180 320 Q250 298 320 320 L330 470 Q250 495 170 470 Z" fill="#3a2a45" stroke="#0f0a14" stroke-width="6"/>
  <path d="M210 340 L290 340 L282 460 Q250 470 218 460 Z" fill="#4a3658" stroke="#0f0a14" stroke-width="4"/>

  <!-- belt with pouches -->
  <rect x="190" y="405" width="120" height="16" fill="#241a2e" stroke="#0f0a14" stroke-width="4"/>
  <circle cx="215" cy="425" r="10" fill="#5a4468" stroke="#0f0a14" stroke-width="3"/>
  <circle cx="285" cy="425" r="10" fill="#5a4468" stroke="#0f0a14" stroke-width="3"/>

  <!-- arms -->
  <rect x="145" y="330" width="30" height="100" rx="14" fill="#2e2138" stroke="#0f0a14" stroke-width="6" transform="rotate(15 160 380)"/>
  <rect x="325" y="330" width="30" height="100" rx="14" fill="#2e2138" stroke="#0f0a14" stroke-width="6" transform="rotate(-15 340 380)"/>
  <circle cx="172" cy="432" r="19" fill="#c98a52" stroke="#0f0a14" stroke-width="5"/>
  <circle cx="328" cy="432" r="19" fill="#c98a52" stroke="#0f0a14" stroke-width="5"/>

  <!-- daggers -->
  <g transform="rotate(-30 172 432)">
    <rect x="164" y="390" width="10" height="55" rx="3" fill="#d8d8d8" stroke="#0f0a14" stroke-width="3"/>
    <rect x="160" y="440" width="18" height="10" rx="2" fill="#5a4428" stroke="#0f0a14" stroke-width="3"/>
  </g>
  <g transform="rotate(30 328 432)">
    <rect x="324" y="390" width="10" height="55" rx="3" fill="#d8d8d8" stroke="#0f0a14" stroke-width="3"/>
    <rect x="320" y="440" width="18" height="10" rx="2" fill="#5a4428" stroke="#0f0a14" stroke-width="3"/>
  </g>

  <!-- neck -->
  <rect x="228" y="290" width="44" height="40" fill="#c98a52" stroke="#0f0a14" stroke-width="5"/>

  <!-- head -->
  <circle cx="250" cy="220" r="78" fill="#d99a63" stroke="#0f0a14" stroke-width="7"/>

  <!-- hood, deep -->
  <path d="M160 220 Q150 100 250 90 Q350 100 340 220 Q340 130 250 130 Q160 130 160 220 Z" fill="#241a2e" stroke="#0f0a14" stroke-width="6"/>

  <!-- shadow under hood -->
  <path d="M175 195 Q175 150 250 148 Q325 150 325 195 Q325 165 250 165 Q175 165 175 195 Z" fill="#0f0a14" opacity="0.55"/>

  <!-- mask across lower face -->
  <path d="M195 235 Q250 260 305 235 L300 270 Q250 290 200 270 Z" fill="#1a1220" stroke="#0f0a14" stroke-width="4"/>

  <!-- eyes -->
  <ellipse cx="220" cy="215" rx="8" ry="10" fill="#c9a0e0"/>
  <ellipse cx="282" cy="215" rx="8" ry="10" fill="#c9a0e0"/>
  <path d="M202 200 Q220 190 238 202" fill="none" stroke="#0f0a14" stroke-width="5" stroke-linecap="round"/>
  <path d="M264 202 Q282 190 300 200" fill="none" stroke="#0f0a14" stroke-width="5" stroke-linecap="round"/>

  <text x="250" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#d8b8ea">rogue</text>
</svg>
