<svg width="500" height="600" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgM" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2a3a5a"/>
      <stop offset="100%" stop-color="#141a2b"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8e0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4a90d9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="600" fill="url(#bgM)"/>
  <circle cx="250" cy="230" r="190" fill="none" stroke="#7ab8e0" stroke-width="6" opacity="0.5"/>

  <!-- glowing orb -->
  <circle cx="365" cy="380" r="55" fill="url(#orbGlow)"/>
  <circle cx="365" cy="380" r="18" fill="#dff4ff" stroke="#2e1b0f" stroke-width="3"/>

  <!-- robe -->
  <path d="M150 330 Q250 300 350 330 L385 570 L115 570 Z" fill="#3a4a8a" stroke="#1a1435" stroke-width="7"/>
  <path d="M200 340 L300 340 L320 570 L180 570 Z" fill="#5a6fb0" stroke="#1a1435" stroke-width="5"/>

  <!-- stars on robe -->
  <g fill="#dff4ff">
    <circle cx="220" cy="420" r="4"/>
    <circle cx="270" cy="470" r="4"/>
    <circle cx="230" cy="510" r="4"/>
  </g>

  <!-- arms -->
  <rect x="120" y="335" width="34" height="100" rx="16" fill="#3a4a8a" stroke="#1a1435" stroke-width="6" transform="rotate(-10 137 385)"/>
  <rect x="346" y="335" width="34" height="100" rx="16" fill="#3a4a8a" stroke="#1a1435" stroke-width="6" transform="rotate(20 363 385)"/>
  <circle cx="130" cy="440" r="20" fill="#c98a52" stroke="#1a1435" stroke-width="5"/>
  <circle cx="365" cy="420" r="20" fill="#c98a52" stroke="#1a1435" stroke-width="5"/>

  <!-- staff -->
  <rect x="358" y="230" width="14" height="220" rx="6" fill="#6a4a28" stroke="#1a1435" stroke-width="4"/>

  <!-- neck -->
  <rect x="228" y="290" width="44" height="40" fill="#e8b98a" stroke="#1a1435" stroke-width="5"/>

  <!-- head -->
  <circle cx="250" cy="220" r="78" fill="#eec49a" stroke="#1a1435" stroke-width="7"/>

  <!-- hat -->
  <path d="M170 195 Q250 170 330 195 L250 30 Z" fill="#2a3a7a" stroke="#1a1435" stroke-width="6"/>
  <ellipse cx="250" cy="197" rx="105" ry="22" fill="#2a3a7a" stroke="#1a1435" stroke-width="6"/>
  <circle cx="250" cy="60" r="10" fill="#dff4ff" stroke="#1a1435" stroke-width="3"/>

  <!-- beard -->
  <path d="M195 245 Q195 320 250 335 Q305 320 305 245 Q295 300 250 310 Q205 300 195 245 Z" fill="#e8e8e8" stroke="#1a1435" stroke-width="5"/>

  <!-- eyes -->
  <ellipse cx="220" cy="215" rx="8" ry="10" fill="#1a1210"/>
  <ellipse cx="280" cy="215" rx="8" ry="10" fill="#1a1210"/>
  <path d="M202 200 Q220 190 238 200" fill="none" stroke="#1a1435" stroke-width="5" stroke-linecap="round"/>
  <path d="M262 200 Q280 190 298 200" fill="none" stroke="#1a1435" stroke-width="5" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M250 222 L245 245 Q250 250 255 245" fill="none" stroke="#1a1435" stroke-width="4" stroke-linecap="round"/>

  <text x="250" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#dff4ff">mage</text>
</svg>
