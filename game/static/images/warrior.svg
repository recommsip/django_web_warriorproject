<svg width="500" height="600" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgW" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#5a3a22"/>
      <stop offset="100%" stop-color="#2b1a12"/>
    </radialGradient>
  </defs>
  <rect width="500" height="600" fill="url(#bgW)"/>
  <circle cx="250" cy="230" r="190" fill="none" stroke="#c47a3a" stroke-width="6" opacity="0.5"/>

  <!-- cape -->
  <path d="M120 330 Q100 480 140 580 L360 580 Q400 480 380 330 Z" fill="#7a1f1f" stroke="#2e1b0f" stroke-width="6"/>

  <!-- body / armor -->
  <path d="M160 320 Q250 290 340 320 L355 470 Q250 510 145 470 Z" fill="#8a8a8a" stroke="#2e1b0f" stroke-width="7"/>
  <path d="M195 340 L305 340 L295 460 Q250 480 205 460 Z" fill="#b0b0b0" stroke="#2e1b0f" stroke-width="5"/>
  <circle cx="250" cy="380" r="18" fill="#d4af37" stroke="#2e1b0f" stroke-width="4"/>

  <!-- shoulder plates -->
  <ellipse cx="165" cy="330" rx="38" ry="30" fill="#9a9a9a" stroke="#2e1b0f" stroke-width="6"/>
  <ellipse cx="335" cy="330" rx="38" ry="30" fill="#9a9a9a" stroke="#2e1b0f" stroke-width="6"/>

  <!-- arms -->
  <rect x="130" y="330" width="34" height="110" rx="16" fill="#8a5a3a" stroke="#2e1b0f" stroke-width="6"/>
  <rect x="336" y="330" width="34" height="110" rx="16" fill="#8a5a3a" stroke="#2e1b0f" stroke-width="6"/>
  <circle cx="147" cy="450" r="22" fill="#c98a52" stroke="#2e1b0f" stroke-width="5"/>
  <circle cx="353" cy="450" r="22" fill="#c98a52" stroke="#2e1b0f" stroke-width="5"/>

  <!-- sword in right hand -->
  <g transform="rotate(18 353 450)">
    <rect x="343" y="330" width="20" height="150" rx="4" fill="#d8d8d8" stroke="#2e1b0f" stroke-width="4"/>
    <rect x="330" y="470" width="46" height="16" rx="4" fill="#7a5a2a" stroke="#2e1b0f" stroke-width="4"/>
    <rect x="347" y="480" width="12" height="40" rx="4" fill="#4a3218" stroke="#2e1b0f" stroke-width="4"/>
  </g>

  <!-- neck -->
  <rect x="228" y="290" width="44" height="40" fill="#c98a52" stroke="#2e1b0f" stroke-width="5"/>

  <!-- head -->
  <circle cx="250" cy="220" r="80" fill="#d99a63" stroke="#2e1b0f" stroke-width="7"/>

  <!-- hair -->
  <path d="M172 195 Q160 120 250 110 Q340 120 328 195 Q328 150 250 150 Q172 150 172 195 Z" fill="#3a2414" stroke="#2e1b0f" stroke-width="5"/>

  <!-- beard -->
  <path d="M185 240 Q195 300 250 305 Q305 300 315 240 Q305 275 250 278 Q195 275 185 240 Z" fill="#4a3018" stroke="#2e1b0f" stroke-width="5"/>

  <!-- eyes -->
  <ellipse cx="218" cy="215" rx="9" ry="11" fill="#1a1210"/>
  <ellipse cx="282" cy="215" rx="9" ry="11" fill="#1a1210"/>
  <path d="M200 195 Q218 185 236 197" fill="none" stroke="#2e1b0f" stroke-width="5" stroke-linecap="round"/>
  <path d="M264 197 Q282 185 300 195" fill="none" stroke="#2e1b0f" stroke-width="5" stroke-linecap="round"/>

  <!-- scar -->
  <line x1="290" y1="180" x2="300" y2="230" stroke="#a85a3a" stroke-width="4" stroke-linecap="round"/>

  <!-- nose + mouth -->
  <path d="M250 220 L244 245 Q250 250 256 245" fill="none" stroke="#2e1b0f" stroke-width="4" stroke-linecap="round"/>
  <path d="M228 258 Q250 268 272 258" fill="none" stroke="#2e1b0f" stroke-width="5" stroke-linecap="round"/>

  <!-- helm horn accents -->
  <path d="M172 190 Q150 140 165 100" fill="none" stroke="#9a9a9a" stroke-width="10" stroke-linecap="round"/>
  <path d="M328 190 Q350 140 335 100" fill="none" stroke="#9a9a9a" stroke-width="10" stroke-linecap="round"/>

  <text x="250" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#f0d9a8">warrior</text>
</svg>
