<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ambient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1a12"/>
      <stop offset="55%" stop-color="#3a2416"/>
      <stop offset="100%" stop-color="#4a2e1a"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf6b" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodPlank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4226"/>
      <stop offset="100%" stop-color="#4a2c17"/>
    </linearGradient>
    <linearGradient id="floorPlank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3a22"/>
      <stop offset="100%" stop-color="#3d2415"/>
    </linearGradient>
    <linearGradient id="fireBody" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff5a1f"/>
      <stop offset="50%" stop-color="#ffab3d"/>
      <stop offset="100%" stop-color="#fff2b0"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a6b"/>
      <stop offset="100%" stop-color="#1f2a40"/>
    </linearGradient>
  </defs>

  <!-- base wall -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#ambient)"/>

  <!-- back wall wood paneling -->
  <g opacity="0.5">
    <rect x="0" y="0" width="1600" height="620" fill="url(#woodPlank)" opacity="0.25"/>
    <g stroke="#241407" stroke-width="2" opacity="0.4">
      <line x1="0" y1="0" x2="0" y2="620"/>
      <line x1="150" y1="0" x2="150" y2="620"/>
      <line x1="300" y1="0" x2="300" y2="620"/>
      <line x1="450" y1="0" x2="450" y2="620"/>
      <line x1="600" y1="0" x2="600" y2="620"/>
      <line x1="750" y1="0" x2="750" y2="620"/>
      <line x1="900" y1="0" x2="900" y2="620"/>
      <line x1="1050" y1="0" x2="1050" y2="620"/>
      <line x1="1200" y1="0" x2="1200" y2="620"/>
      <line x1="1350" y1="0" x2="1350" y2="620"/>
      <line x1="1500" y1="0" x2="1500" y2="620"/>
    </g>
  </g>

  <!-- ceiling beams -->
  <g fill="#241407">
    <rect x="0" y="0" width="1600" height="70" opacity="0.85"/>
    <rect x="180" y="0" width="45" height="140" opacity="0.9"/>
    <rect x="560" y="0" width="45" height="140" opacity="0.9"/>
    <rect x="940" y="0" width="45" height="140" opacity="0.9"/>
    <rect x="1320" y="0" width="45" height="140" opacity="0.9"/>
  </g>

  <!-- hanging lanterns -->
  <g>
    <circle cx="380" cy="230" r="90" fill="url(#lanternGlow)"/>
    <line x1="380" y1="140" x2="380" y2="185" stroke="#1a0f08" stroke-width="3"/>
    <rect x="365" y="185" width="30" height="40" rx="4" fill="#3a2a14" stroke="#1a0f08" stroke-width="2"/>
    <rect x="371" y="192" width="18" height="26" fill="#ffdf8c" opacity="0.85"/>

    <circle cx="1220" cy="230" r="90" fill="url(#lanternGlow)"/>
    <line x1="1220" y1="140" x2="1220" y2="185" stroke="#1a0f08" stroke-width="3"/>
    <rect x="1205" y="185" width="30" height="40" rx="4" fill="#3a2a14" stroke="#1a0f08" stroke-width="2"/>
    <rect x="1211" y="192" width="18" height="26" fill="#ffdf8c" opacity="0.85"/>
  </g>

  <!-- windows with moonlit glow, upper wall -->
  <g>
    <rect x="90" y="90" width="140" height="180" rx="6" fill="url(#windowGlow)" stroke="#1a0f08" stroke-width="8"/>
    <line x1="160" y1="90" x2="160" y2="270" stroke="#1a0f08" stroke-width="5"/>
    <line x1="90" y1="180" x2="230" y2="180" stroke="#1a0f08" stroke-width="5"/>

    <rect x="1370" y="90" width="140" height="180" rx="6" fill="url(#windowGlow)" stroke="#1a0f08" stroke-width="8"/>
    <line x1="1440" y1="90" x2="1440" y2="270" stroke="#1a0f08" stroke-width="5"/>
    <line x1="1370" y1="180" x2="1510" y2="180" stroke="#1a0f08" stroke-width="5"/>
  </g>

  <!-- floor -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#floorPlank)"/>
  <g stroke="#241407" stroke-width="2" opacity="0.5">
    <line x1="0" y1="680" x2="1600" y2="680"/>
    <line x1="0" y1="740" x2="1600" y2="740"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="0" y1="860" x2="1600" y2="860"/>
  </g>

  <!-- stone fireplace, center-back -->
  <g>
    <rect x="640" y="360" width="320" height="290" fill="#4a4038"/>
    <g fill="#5c5148" stroke="#2e2823" stroke-width="2">
      <rect x="650" y="370" width="60" height="45"/>
      <rect x="715" y="370" width="60" height="45"/>
      <rect x="780" y="370" width="60" height="45"/>
      <rect x="845" y="370" width="60" height="45"/>
      <rect x="910" y="370" width="45" height="45"/>
      <rect x="650" y="420" width="60" height="45"/>
      <rect x="715" y="420" width="60" height="45"/>
      <rect x="780" y="420" width="60" height="45"/>
      <rect x="845" y="420" width="60" height="45"/>
      <rect x="910" y="420" width="45" height="45"/>
    </g>
    <!-- hearth opening -->
    <rect x="700" y="470" width="200" height="170" rx="4" fill="#1a1210"/>
    <!-- fire glow -->
    <circle cx="800" cy="590" r="180" fill="url(#fireGlow)"/>
    <!-- flames -->
    <path d="M760 640 Q750 590 775 555 Q780 585 795 570 Q790 610 810 585 Q815 615 830 590 Q845 615 835 640 Z" fill="url(#fireBody)"/>
    <path d="M770 640 L790 640 L782 600 Z" fill="#ffe9a8" opacity="0.8"/>
    <!-- logs -->
    <rect x="740" y="628" width="120" height="16" rx="8" fill="#2e1b0f"/>
    <rect x="750" y="614" width="100" height="14" rx="7" fill="#3a2414"/>
  </g>

  <!-- barrels, left -->
  <g>
    <ellipse cx="120" cy="770" rx="65" ry="18" fill="#1a0f08" opacity="0.4"/>
    <rect x="60" y="640" width="120" height="130" rx="18" fill="#6b4226"/>
    <rect x="60" y="640" width="120" height="130" rx="18" fill="none" stroke="#2e1b0f" stroke-width="5"/>
    <line x1="60" y1="680" x2="180" y2="680" stroke="#2e1b0f" stroke-width="6"/>
    <line x1="60" y1="730" x2="180" y2="730" stroke="#2e1b0f" stroke-width="6"/>

    <ellipse cx="240" cy="800" rx="55" ry="16" fill="#1a0f08" opacity="0.4"/>
    <rect x="190" y="690" width="100" height="110" rx="16" fill="#5c3a22"/>
    <rect x="190" y="690" width="100" height="110" rx="16" fill="none" stroke="#2e1b0f" stroke-width="5"/>
    <line x1="190" y1="725" x2="290" y2="725" stroke="#2e1b0f" stroke-width="5"/>
    <line x1="190" y1="765" x2="290" y2="765" stroke="#2e1b0f" stroke-width="5"/>
  </g>

  <!-- barrels, right -->
  <g>
    <ellipse cx="1480" cy="770" rx="65" ry="18" fill="#1a0f08" opacity="0.4"/>
    <rect x="1420" y="640" width="120" height="130" rx="18" fill="#6b4226"/>
    <rect x="1420" y="640" width="120" height="130" rx="18" fill="none" stroke="#2e1b0f" stroke-width="5"/>
    <line x1="1420" y1="680" x2="1540" y2="680" stroke="#2e1b0f" stroke-width="6"/>
    <line x1="1420" y1="730" x2="1540" y2="730" stroke="#2e1b0f" stroke-width="6"/>

    <ellipse cx="1360" cy="800" rx="55" ry="16" fill="#1a0f08" opacity="0.4"/>
    <rect x="1310" y="690" width="100" height="110" rx="16" fill="#5c3a22"/>
    <rect x="1310" y="690" width="100" height="110" rx="16" fill="none" stroke="#2e1b0f" stroke-width="5"/>
    <line x1="1310" y1="725" x2="1410" y2="725" stroke="#2e1b0f" stroke-width="5"/>
    <line x1="1310" y1="765" x2="1410" y2="765" stroke="#2e1b0f" stroke-width="5"/>
  </g>

  <!-- wooden tables with mugs, foreground -->
  <g>
    <ellipse cx="420" cy="830" rx="140" ry="26" fill="#1a0f08" opacity="0.35"/>
    <ellipse cx="420" cy="800" rx="140" ry="34" fill="#6b4226" stroke="#2e1b0f" stroke-width="4"/>
    <ellipse cx="420" cy="796" rx="120" ry="26" fill="#7a4e2c"/>
    <rect x="330" y="770" width="30" height="34" rx="6" fill="#c47a3a" stroke="#2e1b0f" stroke-width="3"/>
    <rect x="470" y="778" width="26" height="30" rx="6" fill="#c47a3a" stroke="#2e1b0f" stroke-width="3"/>

    <ellipse cx="1180" cy="830" rx="140" ry="26" fill="#1a0f08" opacity="0.35"/>
    <ellipse cx="1180" cy="800" rx="140" ry="34" fill="#6b4226" stroke="#2e1b0f" stroke-width="4"/>
    <ellipse cx="1180" cy="796" rx="120" ry="26" fill="#7a4e2c"/>
    <rect x="1090" y="770" width="30" height="34" rx="6" fill="#c47a3a" stroke="#2e1b0f" stroke-width="3"/>
    <rect x="1230" y="778" width="26" height="30" rx="6" fill="#c47a3a" stroke="#2e1b0f" stroke-width="3"/>
  </g>

  <!-- vignette -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#ambient)" opacity="0.12"/>
</svg>
